name: Sync termsheets (OneDrive)

# Monitore le dossier OneDrive « Termsheets » une fois par jour ouvré (et à la
# demande). Renomme AUTOMATIQUEMENT les fichiers non conformes à la nomenclature,
# met à jour lib/termsheets-index.json (→ nouvelles TS visibles dans l'app),
# vérifie que le CONTENU de chaque PDF correspond à l'ISIN de son nom de fichier,
# et MERGE AUTOMATIQUEMENT la PR d'index (fichier auto-généré). Nécessite les
# secrets Azure AD + la permission Graph Files.ReadWrite.All consentie
# (voir scripts/sync-termsheets.mjs).
on:
  schedule:
    - cron: '0 8 * * *' # TOUS LES MATINS à 10:00 Paris (08:00 UTC en été) : renomme
      # les docs déposés dans Termsheets à la nomenclature + contrôle du décodage.
  workflow_dispatch:
    inputs:
      rename:
        description: 'Renommer les fichiers non conformes (true/false)'
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Boucle de contrôle : sans les secrets GRAPH_*, la synchro ne peut RIEN
      # faire. Plutôt que d'échouer (mail « run failed » quotidien) ou de skipper
      # en silence (index figé sans qu'on le sache), on SKIP proprement : le run
      # reste VERT, mais un ::warning + un résumé de job signalent l'absence de
      # secrets. Dès que Lilian les pose, le renommage/indexation repart.
      - name: Vérifier les secrets Graph
        id: secrets
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          if [ -z "$GRAPH_TENANT_ID" ] || [ -z "$GRAPH_CLIENT_ID" ] || [ -z "$GRAPH_CLIENT_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets GRAPH_* absents (Settings → Secrets and variables → Actions) — synchro des termsheets ignorée. Le run reste vert et reprendra dès que les secrets seront posés."
            {
              echo "### ⏭️ Synchro termsheets ignorée — secrets Graph absents"
              echo "Les secrets **GRAPH_TENANT_ID / GRAPH_CLIENT_ID / GRAPH_CLIENT_SECRET** ne sont pas configurés dans GitHub. Rien à corriger côté code : le renommage et l'indexation reprendront automatiquement une fois les secrets posés."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchroniser le dossier Termsheets
        if: steps.secrets.outputs.skip != 'true'
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_USER: ${{ secrets.GRAPH_USER }}
          GRAPH_FOLDER_PATH: ${{ secrets.GRAPH_FOLDER_PATH }}
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_RENAME: ${{ github.event.inputs.rename || 'true' }}
        run: node scripts/sync-termsheets.mjs
      # Boucle de contrôle : l'ISIN du NOM de fichier doit apparaître dans le
      # CONTENU du PDF (cas réel : un PDF nommé XS3287495306 contenait la TS
      # d'un autre produit). Rapport dans le job summary + data/.
      - name: Contrôler contenu vs nom (ISIN)
        if: steps.secrets.outputs.skip != 'true'
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_USER: ${{ secrets.GRAPH_USER }}
          GRAPH_FOLDER_PATH: ${{ secrets.GRAPH_FOLDER_PATH }}
        run: node scripts/termsheets-content-check.mjs
      # Contrôle « toutes les TS décodées » : liste les produits vivants qui ont
      # une TS mais dont le payoff n'est pas (complètement) décodé. N'échoue pas
      # le job (rapport uniquement) ; nécessite APP_URL (app déployée).
      - name: Contrôler le décodage des payoffs
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -e
          if [ -z "$APP_URL" ]; then
            echo "APP_URL absent — contrôle de décodage ignoré."
            exit 0
          fi
          JSON=$(curl -fsS "${APP_URL%/}/api/lifecycle/decode-status" || echo '{"count":-1}')
          COUNT=$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).count)}catch{console.log(-1)}})')
          echo "Produits vivants avec TS mais payoff non décodé : $COUNT"
          if [ "$COUNT" = "-1" ]; then
            echo "::warning::Contrôle de décodage indisponible (app injoignable)."
          elif [ "$COUNT" != "0" ]; then
            echo "::warning::$COUNT produit(s) avec TS mais NON décodé(s) — voir /api/lifecycle/decode-status ou l'onglet Santé."
            printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);(j.aDecoder||[]).forEach(p=>console.log(`  - ${p.isin} · ${p.nom} (${p.raison})`))})'
            {
              echo "## TS non décodées : $COUNT"
              printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);(j.aDecoder||[]).forEach(p=>console.log(`- **${p.isin}** ${p.nom} — ${p.raison}`))})'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Toutes les TS des produits vivants sont décodées."
          fi
      - name: Ouvrir une PR si l'index a changé
        id: cpr
        if: steps.secrets.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync termsheets index (OneDrive)'
          title: 'Sync termsheets (OneDrive)'
          body: 'Mise à jour automatique de lib/termsheets-index.json depuis le dossier OneDrive Termsheets.'
          branch: auto/termsheets-sync
          add-paths: |
            lib/termsheets-index.json
            data/termsheets-content-check.json
      # Fichiers de données auto-générés → merge immédiat, les nouvelles TS
      # apparaissent dans l'app sans intervention.
      - name: Merger automatiquement la PR de données
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}
