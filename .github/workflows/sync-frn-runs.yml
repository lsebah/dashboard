name: Sync FRN runs (emails → grille FRN)

# Une fois par jour ouvré + refresh hebdo garanti le lundi matin : lit les mails
# de run FRN (Fixed Rate Note) classés dans le sous-dossier Outlook
# « Exchange FRN », parse les prix et met à jour data/frn-quotes.json (run le
# plus récent par couple émetteur/devise/type/maturité). La PR de données est
# MERGÉE AUTOMATIQUEMENT (fichier data/ auto-généré, pas de code) → la page FRN
# se rafraîchit sans intervention. Nécessite les secrets Azure AD + la
# permission Graph « Mail.Read » (voir scripts/sync-frn-runs.mjs).
on:
  schedule:
    - cron: '0 6 * * 1-5' # 1× par jour ouvré (06:00 UTC ≈ 08:00 Paris, lun.→ven.)
    - cron: '0 8 * * 1' # refresh hebdo demandé : lundi 08:00 UTC = 10:00 Paris (heure d'été)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Boucle de contrôle : sans les secrets GRAPH_*, la synchro tournait « en
      # succès » en ne faisant RIEN (skip silencieux). On échoue désormais
      # explicitement pour que l'absence de configuration soit visible.
      - name: Vérifier les secrets Graph
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          if [ -z "$GRAPH_TENANT_ID" ] || [ -z "$GRAPH_CLIENT_ID" ] || [ -z "$GRAPH_CLIENT_SECRET" ]; then
            echo "::error::Secrets GRAPH_TENANT_ID / GRAPH_CLIENT_ID / GRAPH_CLIENT_SECRET absents des secrets GitHub Actions (Settings → Secrets and variables → Actions). La grille FRN ne peut pas se rafraîchir sans eux."
            exit 1
          fi
      - run: npm install --no-save xlsx
      - name: Mettre à jour la grille FRN depuis les derniers runs (email)
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_USER: ${{ secrets.GRAPH_USER }}
          FRN_MAIL_FOLDER: ${{ vars.FRN_MAIL_FOLDER }}
          FRN_MAIL_FOLDER_ID: ${{ vars.FRN_MAIL_FOLDER_ID }}
          FRN_MAIL_QUERY: ${{ vars.FRN_MAIL_QUERY }}
          FRN_MAIL_SENDER: ${{ secrets.FRN_MAIL_SENDER }}
        run: node scripts/sync-frn-runs.mjs
      - name: Ouvrir une PR si la grille FRN a changé
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync grille FRN depuis les runs email'
          title: 'Sync FRN runs (emails → grille FRN)'
          body: 'Mise à jour automatique de data/frn-quotes.json depuis les mails de run FRN (dossier « Exchange FRN »).'
          branch: auto/frn-runs-sync
          add-paths: data/frn-quotes.json
      # Fichier de données auto-généré → merge immédiat (refresh réellement
      # automatique ; sinon la page FRN reste figée sur une PR non mergée).
      - name: Merger automatiquement la PR de données
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}
