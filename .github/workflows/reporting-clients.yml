name: Reporting clients (PDF par email)

# Génère un PDF de valorisation par client (rendu identique à « Imprimer » dans
# l'app : route /print via Puppeteer) puis l'envoie à CE client, en pièce jointe
# (Resend), avec L.sebah@cmf.finance en copie cachée systématique.
#
# UN SEUL AGENT pour les deux cadences — l'ancien envoi hebdomadaire « en lot »
# (tous les PDF dans un seul mail à Laurent) est supprimé :
#   • tous les lundis        → relevé HEBDOMADAIRE aux clients qui l'ont coché
#   • le 1er de chaque mois  → relevé MENSUEL aux clients qui l'ont coché
# Qui reçoit quoi n'est plus codé ici : c'est la fiche client (onglet
# Maintenance → /api/clients/fiches). Laurent conserve une vue consolidée via le
# compte rendu envoyé à la fin de chaque run.
#
# L'app est buildée et lancée dans le job (localhost:3000) ; les prix live
# viennent de Vercel KV (secrets) et les niveaux de Yahoo (fetch sortant).
on:
  schedule:
    # 06:15 (pas 06:00 pile) : évite la minute la plus congestionnée de GitHub
    # Actions, où des millions de crons se déclenchent en même temps.
    - cron: '15 6 * * 1' # lundi 06:15 UTC (~08:15 Paris) — hebdomadaire
    - cron: '15 6 1 * *' # 1er du mois 06:15 UTC — mensuel
  workflow_dispatch:
    inputs:
      cadence:
        description: 'Cadence à servir (détermine quels abonnés sont envoyés)'
        type: choice
        required: true
        default: mensuel
        options: [mensuel, hebdo]
      force_send:
        description: 'Ignorer le verrou anti-double-envoi (renvoi volontaire)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Puppeteer (Chromium)
        run: npm install --no-save puppeteer

      # Cadence selon le déclencheur. Le cron du 1er du mois et celui du lundi
      # peuvent tomber le MÊME jour : ce sont alors deux runs distincts, et c'est
      # le verrou par client (posé par le script) qui empêche le double envoi.
      - name: Déterminer la cadence
        id: cadence
        run: |
          if [ "${{ github.event.schedule }}" = "15 6 1 * *" ]; then
            echo "value=mensuel" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 6 * * 1" ]; then
            echo "value=hebdo" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.cadence || 'mensuel' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build de l'app
        run: npm run build
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Lancer l'app et attendre qu'elle réponde
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          npm run start &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          npx --yes wait-on -t 120000 http://localhost:3000/api/clients

      - name: Générer + envoyer les relevés
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIF_EMAIL_FROM: ${{ secrets.NOTIF_EMAIL_FROM }}
          # Destinataire du COMPTE RENDU de fin de run (qui a reçu / qui n'a rien reçu).
          NOTIF_EMAIL_TO: ${{ secrets.NOTIF_EMAIL_TO }}
          # Copie cachée additionnelle ; L.sebah@cmf.finance est ajoutée d'office
          # par le script, quelle que soit la valeur de ce secret.
          NOTIF_EMAIL_BCC: ${{ secrets.NOTIF_EMAIL_BCC }}
          # Verrou KV anti-double-envoi, posé PAR CLIENT et PAR JOUR. Le script
          # s'arrête sans rien envoyer si ces secrets sont présents mais que le KV
          # ne répond pas — les fiches d'abonnement y sont également stockées.
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then FORCE="--force-send"; fi
          node scripts/reporting_clients.mjs --email --cadence "${{ steps.cadence.outputs.value }}" $FORCE

      # Filet de sécurité : les PDF restent téléchargeables depuis l'onglet Actions
      # même si l'email n'est pas configuré (RESEND_API_KEY absent).
      - name: Archiver les PDF (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-clients-${{ steps.cadence.outputs.value }}
          path: reporting_clients/*.pdf
          if-no-files-found: ignore
          retention-days: 90

      - name: Arrêter l'app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true
