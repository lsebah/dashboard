name: Sync documents clients (OneDrive)

# Inventorie le dossier OneDrive « Documents ▸ Clients »
# (C:\Users\lseba\OneDrive - CMF\Documents\Clients côté poste) et met à jour
# data/client-docs.json → l'onglet Maintenance affiche la présence du DER et la
# liste des pièces de chaque client. La PR de données est MERGÉE
# AUTOMATIQUEMENT (fichier auto-généré, pas de code).
# Nécessite les secrets Azure AD + la permission Graph « Files.Read.All ».
on:
  schedule:
    - cron: '0 7 * * 2' # MARDI 07:00 UTC (≈ 09:00 Paris) — même journée de veille que
      # les runs émetteurs, avant le reporting du lundi suivant.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Boucle de contrôle : sans les secrets GRAPH_*, l'inventaire ne peut RIEN
      # faire. On SKIP proprement (run VERT + ::warning + résumé de job) plutôt
      # que d'échouer chaque semaine ou de remplacer l'inventaire par du vide —
      # ce qui ferait afficher « DER absent » sur toutes les fiches.
      - name: Vérifier les secrets Graph
        id: secrets
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          if [ -z "$GRAPH_TENANT_ID" ] || [ -z "$GRAPH_CLIENT_ID" ] || [ -z "$GRAPH_CLIENT_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets GRAPH_* absents (Settings → Secrets and variables → Actions) — inventaire des documents clients ignoré. Le run reste vert et reprendra dès que les secrets seront posés."
            {
              echo "### ⏭️ Inventaire documents clients ignoré — secrets Graph absents"
              echo "Les secrets **GRAPH_TENANT_ID / GRAPH_CLIENT_ID / GRAPH_CLIENT_SECRET** ne sont pas configurés dans GitHub. Rien à corriger côté code : l'onglet Maintenance affichera « inventaire jamais synchronisé » jusqu'à ce qu'ils soient posés."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Inventorier le dossier Clients
        if: steps.secrets.outputs.skip != 'true'
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_DRIVE_ID: ${{ secrets.GRAPH_DRIVE_ID }}
          GRAPH_USER: ${{ secrets.GRAPH_USER }}
          CLIENTS_FOLDER_PATH: ${{ vars.CLIENTS_FOLDER_PATH }}
        run: node scripts/sync-client-docs.mjs
      - name: Ouvrir une PR si l'inventaire a changé
        id: cpr
        if: steps.secrets.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: inventaire des documents clients (OneDrive)'
          title: 'Sync documents clients (OneDrive)'
          body: "Mise à jour automatique de data/client-docs.json depuis OneDrive ▸ Documents ▸ Clients."
          branch: auto/client-docs-sync
          add-paths: data/client-docs.json
      - name: Merger automatiquement la PR de données
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}
